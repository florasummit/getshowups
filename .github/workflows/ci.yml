# Validates every push to main or a release/** branch, and every pull request.
# Uses NO repository or Cloudflare secrets: safe for pull requests from forks.
# Deployment is NOT done here; Cloudflare Pages deploys from Git on its own.
name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint, unit tests, build, Functions compile
        run: npm run verify

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests (local workerd, fake credentials, mocked Google)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
