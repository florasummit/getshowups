# PROPOSED replacement for .github/workflows/ci.yml (docs/QA_CI_SETUP.md). Not active while it lives in docs/.
# A person with Workflows permission copies it: cp docs/ci-with-qa-report.yml .github/workflows/ci.yml
#
# Validates every push to main or a release/** branch, and every pull request.
# The verify job uses NO repository or Cloudflare secrets: safe for pull requests from forks.
# Only the qa-report job sees QA_INGEST_TOKEN: it runs only for pushes to main, in the `qa-ingest` environment
# (deployment branches: main only), installs no packages and runs only scripts/qa-report.mjs (Node built-ins only).
# Deployment is NOT done here; Cloudflare Pages deploys from Git on its own.
name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The same four checks as `npm run verify`, as separate steps so the unit results are also written as
      # qa-unit.json and the build's change-impact hashes (dist/qa-hashes.json) can go to the QA Command Center.
      - name: Lint (warnings fail)
        run: npx oxlint --deny-warnings

      - name: Unit tests
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/qa-node-reporter.mjs --test-reporter-destination=qa-unit.json 'test/*.test.js'

      - name: Build, Functions compile
        run: npm run build && npm run check:functions

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests (local workerd, fake credentials, mocked Google)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # playwright.config.js writes qa-report.json in CI. Kept whether the tests passed or failed.
      - name: Keep the JSON report for the Control Center
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-report
          path: |
            qa-report.json
            qa-unit.json
            dist/qa-hashes.json
          if-no-files-found: ignore
          retention-days: 14

  qa-report:
    # Posts the run (pass or fail) to the Control Center. main pushes only; never pull requests or forks.
    needs: verify
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: qa-ingest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download the JSON report
        id: report
        continue-on-error: true # no report = the browser tests never ran (an earlier step failed); nothing to post
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qa-report

      # Browser results (qa-report.json) and unit results (qa-unit.json), with the build's change-impact hashes
      # (dist/qa-hashes.json, read by default when present).
      - name: Post to the Control Center (mocked providers)
        if: steps.report.outcome == 'success' && (hashFiles('qa-report.json') != '' || hashFiles('qa-unit.json') != '')
        run: |
          ARGS=(--source ci --provider mocked)
          [ -f qa-report.json ] && ARGS=(qa-report.json "${ARGS[@]}")
          [ -f qa-unit.json ] && ARGS+=(--unit qa-unit.json)
          node scripts/qa-report.mjs "${ARGS[@]}"
        env:
          QA_INGEST_URL: ${{ vars.QA_INGEST_URL }}
          QA_INGEST_TOKEN: ${{ secrets.QA_INGEST_TOKEN }}
